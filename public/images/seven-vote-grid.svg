<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- 7-vote grid: combination of layout-grid and grid-2x2-check concepts -->
  <!-- 7 cells in a grid, each representing a vote, with the 7th as a checkmark -->

  <g transform="translate(100, 40)">
    <!-- Row 1: 3 cells -->
    <rect x="0" y="0" width="120" height="120" rx="8" fill="#1a3d35" stroke="#408A71" stroke-width="1"/>
    <text x="60" y="50" text-anchor="middle" font-family="monospace" font-size="11" fill="#6AB89A" font-weight="600">RSI</text>
    <text x="60" y="75" text-anchor="middle" font-family="monospace" font-size="24" fill="#BCFD49">✓</text>
    <text x="60" y="100" text-anchor="middle" font-family="monospace" font-size="9" fill="#408A71">VOTE 1</text>

    <rect x="140" y="0" width="120" height="120" rx="8" fill="#1a3d35" stroke="#408A71" stroke-width="1"/>
    <text x="200" y="50" text-anchor="middle" font-family="monospace" font-size="11" fill="#6AB89A" font-weight="600">MACD</text>
    <text x="200" y="75" text-anchor="middle" font-family="monospace" font-size="24" fill="#BCFD49">✓</text>
    <text x="200" y="100" text-anchor="middle" font-family="monospace" font-size="9" fill="#408A71">VOTE 2</text>

    <rect x="280" y="0" width="120" height="120" rx="8" fill="#1a3d35" stroke="#408A71" stroke-width="1"/>
    <text x="340" y="50" text-anchor="middle" font-family="monospace" font-size="11" fill="#6AB89A" font-weight="600">BOLL</text>
    <text x="340" y="75" text-anchor="middle" font-family="monospace" font-size="24" fill="#BCFD49">✓</text>
    <text x="340" y="100" text-anchor="middle" font-family="monospace" font-size="9" fill="#408A71">VOTE 3</text>

    <!-- Row 2: 4 cells -->
    <rect x="0" y="140" width="90" height="120" rx="8" fill="#1a3d35" stroke="#408A71" stroke-width="1"/>
    <text x="45" y="185" text-anchor="middle" font-family="monospace" font-size="10" fill="#6AB89A" font-weight="600">EMA</text>
    <text x="45" y="210" text-anchor="middle" font-family="monospace" font-size="20" fill="#BCFD49">✓</text>
    <text x="45" y="235" text-anchor="middle" font-family="monospace" font-size="8" fill="#408A71">VOTE 4</text>

    <rect x="105" y="140" width="90" height="120" rx="8" fill="#1a3d35" stroke="#408A71" stroke-width="1"/>
    <text x="150" y="185" text-anchor="middle" font-family="monospace" font-size="10" fill="#6AB89A" font-weight="600">MOM</text>
    <text x="150" y="210" text-anchor="middle" font-family="monospace" font-size="20" fill="#BCFD49">✓</text>
    <text x="150" y="235" text-anchor="middle" font-family="monospace" font-size="8" fill="#408A71">VOTE 5</text>

    <rect x="210" y="140" width="90" height="120" rx="8" fill="#1a3d35" stroke="#408A71" stroke-width="1"/>
    <text x="255" y="185" text-anchor="middle" font-family="monospace" font-size="10" fill="#6AB89A" font-weight="600">MREV</text>
    <text x="255" y="210" text-anchor="middle" font-family="monospace" font-size="20" fill="#BCFD49">✓</text>
    <text x="255" y="235" text-anchor="middle" font-family="monospace" font-size="8" fill="#408A71">VOTE 6</text>

    <rect x="315" y="140" width="90" height="120" rx="8" fill="#285A48" stroke="#BCFD49" stroke-width="2"/>
    <text x="360" y="180" text-anchor="middle" font-family="monospace" font-size="10" fill="#BCFD49" font-weight="600">NEURAL</text>
    <text x="360" y="210" text-anchor="middle" font-family="monospace" font-size="24" fill="#BCFD49">✓</text>
    <text x="360" y="240" text-anchor="middle" font-family="monospace" font-size="8" fill="#BCFD49">VOTE 7</text>
  </g>

  <!-- Consensus label -->
  <text x="300" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#BCFD49" letter-spacing="4">7 / 7  CONSENSUS — EXECUTE</text>
  <rect x="120" y="355" width="360" height="2" rx="1" fill="#BCFD49" opacity="0.3"/>
</svg>
